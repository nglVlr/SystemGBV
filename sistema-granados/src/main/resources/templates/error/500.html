<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Error del sistema', ~{:: #pagina})}">
<body>
<div id="pagina">
    <div class="pagina-error">
        <div>
            <div class="codigo">500</div>
            <h1>Algo salió mal en el servidor</h1>
            <p>Ocurrió un error inesperado. Intenta de nuevo; si sigue pasando,
               revisa la consola del servidor o avisa al administrador.</p>
            <a th:href="@{/}" class="btn-jade">
                <i class="bi bi-house"></i> Volver al inicio
            </a>
        </div>
    </div>
</div>
</body>
</html>
