# ============================================================
#  SISTEMA GRANADOS - Perfil de produccion (Render.com)
# ============================================================
# Render inyecta PORT (default 10000). Spring lo lee asi:
server.port=${PORT:8085}

# Base de datos: Render inyecta HOST, PORT, DBNAME, USER, PASSWORD via render.yaml.
# NO usar SPRING_DATASOURCE_URL aqui: las env vars tienen prioridad sobre este archivo
# y un valor embebido en la imagen Docker (p. ej. host "postgres") lo pisaria.
# Sin fallback de host: si falta SPRING_DATASOURCE_HOST, el arranque falla de inmediato.
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DBNAME}?sslmode=require
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool mas conservador para plan gratuito/starter de Render
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ddl-auto=update se mantiene (crea/actualiza tablas automaticamente)
spring.jpa.hibernate.ddl-auto=update

# Cache de Thymeleaf activo en produccion
spring.thymeleaf.cache=true

# Render termina HTTPS delante de Tomcat. Sin esto, cookies/CSRF
# pueden pensarse HTTP y el POST de login falla o se pierde.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# Logs: solo errores de Hibernate
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ---- Asistente de distribucion de pagos (IA) ----
# En el dashboard de Render: agregar la env var GEMINI_API_KEY (Google AI
# Studio, nivel gratis). Sin ella el asistente funciona con el clasificador
# local por palabras clave.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash
