# ============================================================
#  SISTEMA GRANADOS - Configuracion
# ============================================================
spring.application.name=sistema-granados
server.port=8085
# 0.0.0.0 = esta PC sirve a otras maquinas de la red local (temporal, antes de subir a web)
server.address=0.0.0.0

# Varias PCs a la vez: hilos HTTP y conexiones a Postgres
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=50
server.tomcat.connection-timeout=60000
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# ---- Base de datos (PostgreSQL via Docker) ----
# Stack completo (app + BD):  docker compose up -d --build
# Solo la BD (si corres la app en IntelliJ):  docker compose up -d postgres
# En el contenedor, SPRING_DATASOURCE_URL apunta a host "postgres".
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_granados
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=9508

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=16

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ---- Subida de archivos ----
# 100 MB por archivo (ZIP de NPGs, PDFs, etc.). La peticion va un poco mas alta
# para cubrir varios archivos a la vez y el overhead de multipart.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=150MB
server.tomcat.max-http-form-post-size=150MB
server.tomcat.max-swallow-size=150MB
server.tomcat.max-part-count=1000

# ---- Almacenamiento de archivos de trabajo ----
app.storage.uploads=./storage/uploads
app.storage.generados=./storage/generados

# ---- Plantillas y logs (LAN: cache on; DevTools no pisa estas props) ----
spring.thymeleaf.cache=true
spring.devtools.add-properties=false
logging.level.com.granados=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ------------------- Recursos Humanos -------------------
# Nombre de quien firma las constancias de permiso (editable aqui)
rrhh.encargada.nombre=
rrhh.encargada.cargo=Encargada de Recursos Humanos
